<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Spotify 授權完成</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:24px;max-width:560px;line-height:1.45;background:#111;color:#eee}
code,textarea{word-break:break-all}
textarea{width:100%;min-height:96px;margin:8px 0;padding:10px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#eee}
button{padding:12px 16px;border:0;border-radius:10px;background:#1db954;color:#000;font-weight:700;margin:6px 6px 6px 0}
a.btn{display:inline-block;padding:12px 16px;border-radius:10px;background:#0a84ff;color:#fff;text-decoration:none;font-weight:700}
.err{color:#ff6b6b}.ok{color:#1db954}.hint{color:#aaa;font-size:14px}
</style>
</head>
<body>
<h1>Spotify 授權</h1>
<p id="status">讀取中…</p>
<textarea id="payload" readonly></textarea>
<p>
<button id="copyBtn" type="button">複製 code／網址</button>
<a id="backLink" class="btn" style="display:none" href="#">回到裝置完成授權</a>
</p>
<p class="hint">若無法自動返回裝置：複製上方內容，貼回 ESP32 網頁的「授權後網址／code」欄位，再按「完成授權」。</p>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const err=params.get('error');
  const code=params.get('code')||'';
  const state=params.get('state')||'';
  const status=document.getElementById('status');
  const payload=document.getElementById('payload');
  const back=document.getElementById('backLink');
  const copyBtn=document.getElementById('copyBtn');

  if(err){
    status.className='err';
    status.textContent='授權失敗：'+err+(params.get('error_description')?(' — '+params.get('error_description')):'');
    payload.value=location.href;
    return;
  }
  if(!code){
    status.className='err';
    status.textContent='找不到 code。請確認 Spotify Redirect URI 指向本頁。';
    payload.value=location.href;
    return;
  }

  status.className='ok';
  status.textContent='授權成功。請回到裝置完成登入。';
  payload.value=location.href;

  if(state && /^\d{1,3}(\.\d{1,3}){3}$/.test(state)){
    back.style.display='inline-block';
    back.href='http://'+state+'/?sp_code='+encodeURIComponent(code);
    back.textContent='回到裝置 '+state+' 完成授權';
  }

  copyBtn.onclick=async()=>{
    try{
      await navigator.clipboard.writeText(payload.value);
      status.textContent='已複製，請貼回 ESP32 網頁完成授權';
    }catch(e){
      payload.select();
      status.textContent='請手動選取上方文字並複製';
    }
  };
})();
</script>
</body>
</html>
